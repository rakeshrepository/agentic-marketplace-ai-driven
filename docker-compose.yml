version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    networks:
      - agentic-network

  # Kafka MCP Server
  kafka-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/kafka-mcp-server/Dockerfile
    container_name: kafka-mcp-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_TIMEOUT: 30000
      KAFKA_DEFAULT_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION: 1
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database MCP Server
  database-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/database-mcp-server/Dockerfile
    container_name: database-mcp-server
    ports:
      - "8083:8083"
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Topic Management Agent
  topic-management-agent:
    build:
      context: .
      dockerfile: agents/topic-management-agent/Dockerfile
    container_name: topic-management-agent
    depends_on:
      kafka-mcp-server:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT: 120000
      MCP_KAFKA_URL: http://kafka-mcp-server:8081
      MCP_TIMEOUT: 30000
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/agent/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Application
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web-app
    depends_on:
      topic-management-agent:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  ollama-data:
