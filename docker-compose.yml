version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI for visual management and monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - agentic-network

  # Ollama LLM Service - Using host machine's Ollama instead of container
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ${HOME}/.ollama:/root/.ollama
  #   networks:
  #     - agentic-network

  # PostgreSQL Database for Agent Registry
  postgres:
    image: postgres:16-alpine
    container_name: agent-registry-db
    environment:
      POSTGRES_DB: agent_registry
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agent_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent Registry Service
  agent-registry:
    build:
      context: .
      dockerfile: agent-registry-service/Dockerfile
    pull_policy: build
    container_name: agent-registry
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_registry
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka MCP Server
  kafka-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/kafka-mcp-server/Dockerfile
    pull_policy: build
    container_name: kafka-mcp-server
    image: agentic-marketplace/kafka-mcp-server:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_TIMEOUT: 30000
      KAFKA_DEFAULT_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION: 1
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Web Application
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    pull_policy: build
    container_name: web-app
    depends_on:
      kafka-mcp-server:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VITE_AGENT_REGISTRY_URL: http://localhost:8090
      VITE_KAFKA_MCP_URL: http://localhost:8081
      VITE_OLLAMA_URL: http://host.docker.internal:11434
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
