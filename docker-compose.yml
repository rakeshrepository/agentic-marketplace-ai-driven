version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI for visual management and monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - agentic-network

  # Ollama LLM Service - Using host machine's Ollama instead of container
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ${HOME}/.ollama:/root/.ollama
  #   networks:
  #     - agentic-network

  # PostgreSQL Database for Agent Registry
  postgres:
    image: postgres:16-alpine
    container_name: agent-registry-db
    environment:
      POSTGRES_DB: agent_registry
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agent_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent Registry Service
  agent-registry:
    build:
      context: .
      dockerfile: agent-registry-service/Dockerfile
    pull_policy: build
    container_name: agent-registry
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_registry
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka MCP Server
  kafka-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/kafka-mcp-server/Dockerfile
    pull_policy: build
    container_name: kafka-mcp-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ADMIN_TIMEOUT: 30000
      KAFKA_DEFAULT_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION: 1
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database MCP Server
  database-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/database-mcp-server/Dockerfile
    pull_policy: build
    container_name: database-mcp-server
    ports:
      - "8083:8083"
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog - SMTP testing server with web UI
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Email MCP Server
  email-mcp-server:
    build:
      context: .
      dockerfile: mcp-server/email-mcp-server/Dockerfile
    pull_policy: build
    container_name: email-mcp-server
    depends_on:
      mailhog:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      EMAIL_FROM_ADDRESS: noreply@agentic-marketplace.local
      EMAIL_FROM_NAME: Agentic Marketplace
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/api/emails/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Topic Management Agent
  topic-management-agent:
    build:
      context: .
      dockerfile: agents/topic-management-agent/Dockerfile
    pull_policy: build
    container_name: topic-management-agent
    depends_on:
      kafka-mcp-server:
        condition: service_healthy
      email-mcp-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # LLM Provider Configuration (Options: ollama, openai)
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120000}
      
      # Ollama Configuration (used when LLM_PROVIDER=ollama)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:latest}
      
      # OpenAI Configuration (used when LLM_PROVIDER=openai)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # MCP Configuration
      MCP_KAFKA_URL: http://kafka-mcp-server:8081
      MCP_EMAIL_URL: http://email-mcp-server:8084
      MCP_TIMEOUT: 30000
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/agent/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Management Agent
  database-management-agent:
    build:
      context: .
      dockerfile: agents/database-management-agent/Dockerfile
    pull_policy: build
    container_name: database-management-agent
    depends_on:
      database-mcp-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # LLM Provider Configuration (Options: ollama, openai)
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120000}
      
      # Ollama Configuration (used when LLM_PROVIDER=ollama)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:latest}
      
      # OpenAI Configuration (used when LLM_PROVIDER=openai)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      
      # MCP Configuration
      MCP_DATABASE_URL: http://database-mcp-server:8083
      MCP_TIMEOUT: 30000
    networks:
      - agentic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/agent/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Application
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    pull_policy: build
    container_name: web-app
    depends_on:
      topic-management-agent:
        condition: service_healthy
      database-management-agent:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VITE_AGENT_REGISTRY_URL: http://localhost:8090
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
