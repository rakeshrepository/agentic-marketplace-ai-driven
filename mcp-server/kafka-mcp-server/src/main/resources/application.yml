# Kafka MCP Server Configuration

server:
  port: 8081

spring:
  application:
    name: kafka-mcp-server

# Kafka Configuration (config-driven)
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  admin:
    request-timeout-ms: ${KAFKA_ADMIN_TIMEOUT:30000}
    default-partitions: ${KAFKA_DEFAULT_PARTITIONS:1}
    default-replication-factor: ${KAFKA_DEFAULT_REPLICATION:3}

# Logging
logging:
  level:
    com.agentic.marketplace: DEBUG
    org.apache.kafka: WARN
