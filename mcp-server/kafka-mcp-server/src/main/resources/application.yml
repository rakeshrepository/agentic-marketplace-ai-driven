# Kafka MCP Server Configuration

server:
  port: 8081

spring:
  application:
    name: kafka-mcp-server

# MCP Configuration
mcp:
  server:
    enabled: true
    transport: sse  # Server-Sent Events for remote access (also supports: stdio for local)
    name: kafka-mcp-server
    version: 1.0.0
    description: "Model Context Protocol server for Apache Kafka operations"
    sse:
      endpoint: /mcp/sse
      cors:
        enabled: true
        allowed-origins: "*"  # Configure appropriately for production
        allowed-methods: GET, POST, OPTIONS
        allowed-headers: "*"
    
    # Server capabilities
    capabilities:
      tools: true
      resources: true
      prompts: true
      logging: true

# Kafka Configuration (config-driven)
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  admin:
    request-timeout-ms: ${KAFKA_ADMIN_TIMEOUT:30000}
    default-partitions: ${KAFKA_DEFAULT_PARTITIONS:1}
    default-replication-factor: ${KAFKA_DEFAULT_REPLICATION:3}

# Logging
logging:
  level:
    com.agentic.marketplace: DEBUG
    org.apache.kafka: WARN
    io.modelcontextprotocol: DEBUG

