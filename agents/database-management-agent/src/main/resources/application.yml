# Database Management Agent Configuration

server:
  port: 8082

spring:
  application:
    name: database-management-agent

# LLM Configuration (config-driven)
llm:
  provider: ${LLM_PROVIDER:ollama}  # Options: ollama, openai
  timeout: ${LLM_TIMEOUT:60000}

# Ollama Configuration (when provider=ollama)
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}

# OpenAI Configuration (when provider=openai)
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

# MCP Server Configuration
mcp:
  database:
    base-url: ${MCP_DATABASE_URL:http://localhost:8083}
    timeout: ${MCP_TIMEOUT:30000}

# Agent Configuration
agent:
  id: database-management-agent
  name: Database Management Agent
  category: infrastructure

# Logging
logging:
  level:
    com.agentic.marketplace: DEBUG
    root: INFO
